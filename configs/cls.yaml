
task: classification

model:
  name: simple_cnn
  num_classes: 200
  pretrained: false

training:
  epochs: 20
  batch_size: 32
  learning_rate: 0.001
  optimizer: adam
  loss: cross_entropy

early_stopping:
  enabled: true
  patience: 5
  min_delta: 0.0

checkpoint:
  save_dir: outputs/checkpoints

mlflow:
  experiment_name: Bird_Classification
  tracking_uri: http://127.0.0.1:5000